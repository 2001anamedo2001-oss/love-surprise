<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مفاجأة العيد ❤️</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      overflow: hidden;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffd6e7, #fff0f6, #ffe8cc);
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      padding: 28px 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
      text-align: center;
      position: relative;
      z-index: 5;
    }

    .title {
      font-size: 28px;
      color: #d6336c;
      margin: 0 0 10px;
    }

    .subtitle {
      color: #6b4b57;
      line-height: 1.8;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 2px solid #ffc2d1;
      outline: none;
      font-size: 18px;
      text-align: center;
    }

    .input:focus {
      border-color: #ff6b9a;
      box-shadow: 0 0 0 4px rgba(255, 107, 154, 0.12);
    }

    .btn {
      width: 100%;
      margin-top: 14px;
      border: none;
      border-radius: 16px;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #ff4d88, #ff7aa2);
      box-shadow: 0 10px 20px rgba(255, 77, 136, 0.25);
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .wrong-box {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 18px;
      background: #fff1f3;
      border: 2px dashed #ff8fab;
      animation: pop 0.35s ease;
    }

    .wrong-face {
      font-size: 56px;
      margin-bottom: 8px;
    }

    .wrong-text {
      color: #c9184a;
      font-size: 22px;
      font-weight: bold;
    }

    .wrong-sub {
      color: #8a4b5f;
      margin-top: 6px;
      font-size: 15px;
    }

    @keyframes pop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .hidden {
      display: none !important;
    }

    #lovePage {
      display: none;
      background:
        radial-gradient(circle at top right, rgba(255,255,255,0.35), transparent 25%),
        radial-gradient(circle at bottom left, rgba(255,255,255,0.22), transparent 25%),
        linear-gradient(135deg, #ff5d8f, #ff8fab, #ffc2d1, #ffe066);
    }

    .love-card {
      width: min(92vw, 760px);
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.28);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 30px 22px;
      text-align: center;
      color: white;
      box-shadow: 0 15px 50px rgba(0,0,0,0.15);
      z-index: 5;
      position: relative;
    }

    .eid {
      font-size: clamp(28px, 5vw, 48px);
      margin: 0 0 10px;
      text-shadow: 0 3px 10px rgba(0,0,0,0.14);
    }

    .name-show {
      font-size: clamp(34px, 8vw, 70px);
      font-weight: bold;
      margin: 12px 0;
      color: #fff;
      text-shadow: 0 4px 14px rgba(0,0,0,0.18);
      opacity: 0;
      transform: scale(0.6);
      animation: namePop 1s ease forwards;
      animation-delay: 0.3s;
    }

    @keyframes namePop {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }
      60% {
        opacity: 1;
        transform: scale(1.08);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .typewriter {
      min-height: 64px;
      font-size: clamp(20px, 3.8vw, 34px);
      line-height: 1.8;
      font-weight: bold;
      margin: 18px 0 10px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    .small-msg {
      font-size: clamp(15px, 2.5vw, 20px);
      opacity: 0.96;
      line-height: 1.9;
      margin-top: 10px;
    }

    .footer-note {
      margin-top: 16px;
      font-size: 13px;
      opacity: 0.95;
    }

    .heart {
      position: absolute;
      bottom: -40px;
      color: rgba(255,255,255,0.85);
      animation: floatUp linear forwards;
      user-select: none;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1) rotate(0deg);
        opacity: 0.95;
      }
      to {
        transform: translateY(-115vh) scale(1.5) rotate(25deg);
        opacity: 0;
      }
    }

    .burst-heart {
      position: absolute;
      left: 50%;
      top: 50%;
      font-size: 24px;
      z-index: 2;
      pointer-events: none;
      animation: burstMove 1.5s ease-out forwards;
    }

    @keyframes burstMove {
      0% {
        transform: translate(-50%, -50%) translate(0,0) scale(0.5);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) translate(var(--x), var(--y)) scale(1.6);
        opacity: 0;
      }
    }

    .sparkle {
      position: absolute;
      color: rgba(255,255,255,0.95);
      animation: twinkle 2.2s infinite ease-in-out;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @media (max-width: 480px) {
      .card {
        padding: 24px 16px;
      }
      .title {
        font-size: 24px;
      }
      .subtitle {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="screen" id="loginPage">
    <div class="card">
      <h1 class="title">حاجه صغبره كدا  ❤️</h1>
      <div class="subtitle">
        فيه باسورد كدا مفروض انتي عارفاه...
        اكتبيه الأول عشان تفتح ✨
      </div>

      <input
        type="password"
        id="pass"
        class="input"
        placeholder="اكتبي الباسورد هنا"
        onkeydown="if(event.key==='Enter'){checkPass();}"
      />

      <button class="btn" onclick="checkPass()">سيربرايز</button>

      <div id="wrongBox" class="wrong-box">
        <div class="wrong-face">😜</div>
        <div class="wrong-text">مش فاتح</div>
        <div class="wrong-sub">جرّبي تاني يا قمر</div>
      </div>
    </div>
  </div>

  <div class="screen" id="lovePage">
    <div class="love-card">
      <h1 class="eid"> عيد سعيد يا بسبوسه ❤️</h1>


      <div class="name-show" id="بسنت">يا حبيبتي</div>

      <div class="typewriter" id="typedText"></div>

      <p class="small-msg">
        ربنا يديم ضحكتك وفرحتك علي طول،
        وكل عيد وانتي معايا يارب وربنا يخليكي ليا واقدر اكون زي ما بتتمني يارب ✨
      </p>

      <div class="footer-note">بإذن الله العيد الجاي نكون في بيتنا  ❤️</div>
    </div>
  </div>

  <script>
 
    const correctPassword = "MmBb20101211";

 
    const herName = "bsbosa❤️";

    const loginPage = document.getElementById("loginPage");
    const lovePage = document.getElementById("lovePage");
    const wrongBox = document.getElementById("wrongBox");
    const passInput = document.getElementById("pass");
    const typedText = document.getElementById("typedText");
    const girlName = document.getElementById("girlName");

    const message = "كل سنة وانتي طيبة يا أجمل حد في حياتي و كل حياتي اصلا ❤️";

    girlName.textContent = herName;

    function checkPass() {
      const input = passInput.value.trim();

      if (input === correctPassword) {
        loginPage.classList.add("hidden");
        lovePage.style.display = "flex";
        startExperience();
      } else {
        wrongBox.style.display = "block";
        passInput.value = "";
        passInput.focus();

        wrongBox.animate(
          [
            { transform: "scale(0.9)" },
            { transform: "scale(1.04)" },
            { transform: "scale(1)" }
          ],
          { duration: 320, easing: "ease" }
        );
      }
    }

    let started = false;

    function startExperience() {
      if (started) return;
      started = true;

      createSparkles();
      heartBurst();
      startHearts();

      setTimeout(() => {
        typeWriter(message, typedText, 75);
      }, 500);
    }

    function typeWriter(text, element, speed) {
      let i = 0;
      element.textContent = "";

      const timer = setInterval(() => {
        element.textContent += text.charAt(i);
        i++;
        if (i >= text.length) clearInterval(timer);
      }, speed);
    }

    function startHearts() {
      setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = Math.random() > 0.5 ? "❤" : "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (18 + Math.random() * 26) + "px";
        heart.style.animationDuration = (4 + Math.random() * 4) + "s";
        heart.style.opacity = (0.5 + Math.random() * 0.5).toFixed(2);
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 8500);
      }, 260);
    }

    function heartBurst() {
      for (let i = 0; i < 35; i++) {
        const heart = document.createElement("div");
        heart.className = "burst-heart";
        heart.textContent = Math.random() > 0.5 ? "❤" : "💖";

        const angle = Math.random() * Math.PI * 2;
        const distance = 120 + Math.random() * 220;
        const x = Math.cos(angle) * distance + "px";
        const y = Math.sin(angle) * distance + "px";

        heart.style.setProperty("--x", x);
        heart.style.setProperty("--y", y);
        heart.style.fontSize = (18 + Math.random() * 28) + "px";

        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1800);
      }
    }

    function createSparkles() {
      for (let i = 0; i < 18; i++) {
        const s = document.createElement("div");
        s.className = "sparkle";
        s.textContent = Math.random() > 0.5 ? "✨" : "⭐";
        s.style.top = Math.random() * 100 + "vh";
        s.style.left = Math.random() * 100 + "vw";
        s.style.fontSize = (14 + Math.random() * 18) + "px";
        s.style.animationDelay = (Math.random() * 2.2) + "s";
        document.body.appendChild(s);
      }
    }
  </script>
</body>
</html>
